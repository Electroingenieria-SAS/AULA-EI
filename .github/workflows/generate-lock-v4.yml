name: Generate package-lock v4

on:
  push:
    branches:
      - perf/security-v4-2026-09-22

permissions:
  contents: write

jobs:
  lock:
    if: "!contains(github.event.head_commit.message, 'chore(ci): generate package-lock')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/security-v4-2026-09-22

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): generate package-lock"
          git push origin HEAD:perf/security-v4-2026-09-22
