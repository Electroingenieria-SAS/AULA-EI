name: Database DR Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-dr-baseline.yml'
      - 'supabase/migrations/**'
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aula-ei-database-dr-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require database backup secret
        shell: bash
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not configured. A successful DR control requires a real roles.sql + schema.sql artifact."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.120.0

      - name: Generate structural DR baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dr-baseline
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dr-baseline/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dr-baseline/schema.sql

      - name: Validate baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f dr-baseline/roles.sql
          test -s dr-baseline/schema.sql
          grep -Eq 'CREATE (TABLE|FUNCTION|TYPE|SEQUENCE|SCHEMA)|CREATE POLICY|ALTER TABLE' dr-baseline/schema.sql
          if grep -Eq 'postgres(ql)?://|sb_secret_' dr-baseline/roles.sql dr-baseline/schema.sql; then
            echo "::error::Potential credential material detected in generated baseline."
            exit 1
          fi
          sha256sum dr-baseline/roles.sql dr-baseline/schema.sql > dr-baseline/SHA256SUMS.txt
          {
            echo "project_ref=ipoidimevokogptydbvt"
            echo "source_commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "supabase_cli=$(supabase --version)"
            echo "scope=roles+schema; no application data; no Storage objects"
          } > dr-baseline/MANIFEST.txt

      - name: Upload DR baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aula-ei-dr-baseline-${{ github.run_id }}
          path: dr-baseline/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
