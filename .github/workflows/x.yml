name: x
on:
  push:
    branches: [main]
    paths: ['.github/workflows/x.yml']
permissions:
  contents: write
jobs:
  x:
    if: github.event.head_commit.message == 'chore: stage distribution transform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts javascript-obfuscator@5.6.0
      - run: node x.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh distribution"
          git push origin HEAD:main
