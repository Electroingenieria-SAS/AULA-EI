name: Probe official certificate stamp source
on:
  push:
    branches:
      - feat/certificate-auto-approved-seal-20261113
    paths:
      - .github/workflows/probe-approved-stamp.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      THUMB: 'https://media.canva.com/v2/image-resize/format:PNG/height:77/quality:100/uri:ifs%3A%2F%2FM%2Fff5fbc6b-d171-48d9-b375-c940d8206910/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACMXkmkdnZqtZjQWT3pUxr1QC9kth0sax42JuEjIKU2D&exp=1794598493&osig=AAAAAAAAAAAAAAAAAAAAAK4eRu9YGhwswnyvMggmcMXseuVprQjVp_kkjft2Z-wE&signer=media-rpc&token=AAIAAU0AJGZmNWZiYzZiLWQxNzEtNDhkOS1iMzc1LWM5NDBkODIwNjkxMAAAAAABodZn20jV9ZJGZLtk55xxPXQvfs-wEOWpdXDI5Z6XdBHacZVlsA&x-canva-quality=thumbnail'
      FULL: 'https://media.canva.com/v2/image-resize/format:PNG/height:779/quality:100/uri:ifs%3A%2F%2FM%2Fff5fbc6b-d171-48d9-b375-c940d8206910/watermark:F/width:2020?csig=AAAAAAAAAAAAAAAAAAAAACMXkmkdnZqtZjQWT3pUxr1QC9kth0sax42JuEjIKU2D&exp=1794598493&osig=AAAAAAAAAAAAAAAAAAAAAK4eRu9YGhwswnyvMggmcMXseuVprQjVp_kkjft2Z-wE&signer=media-rpc&token=AAIAAU0AJGZmNWZiYzZiLWQxNzEtNDhkOS1iMzc1LWM5NDBkODIwNjkxMAAAAAABodZn20jV9ZJGZLtk55xxPXQvfs-wEOWpdXDI5Z6XdBHacZVlsA'
    steps:
      - name: Download and examine image variants
        shell: bash
        run: |
          python3 - <<'PY'
          import os,urllib.request,struct
          for key in ('THUMB','FULL'):
              try:
                  req=urllib.request.Request(os.environ[key],headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read()
                      info='PNG' if data[:8]==b'\x89PNG\r\n\x1a\n' else 'OTHER'
                      dims=struct.unpack('>II',data[16:24]) if info=='PNG' else None
                      print(key,'status',response.status,'format',info,'dims',dims,'bytes',len(data))
              except Exception as err:
                  print(key,'FAILED',type(err).__name__,str(err)[:140])
          PY
